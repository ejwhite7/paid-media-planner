name: Notify GrowthCast marketplace

# When plugin.json changes on main, ask ejwhite7/growthcast-plugins to pin the new
# version. Without the token secret, the marketplace still picks it up on its 6-hourly sync.
on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch plugin-release
        if: env.TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ejwhite7/growthcast-plugins/dispatches \
            -d "{\"event_type\":\"plugin-release\",\"client_payload\":{\"plugin\":\"${GITHUB_REPOSITORY#*/}\"}}"
